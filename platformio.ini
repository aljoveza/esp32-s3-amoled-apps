; =========================================================================
;  Waveshare ESP32-S3-Touch-AMOLED-1.8 — multi-app project
;
;  Every app is one [env:...] below. They all share src/common (board
;  bring-up, IMU, rotated drawing surface); build_src_filter picks which
;  app's sources get compiled in.
;
;  Add an app:
;    1. mkdir src/apps/<name>, add main.cpp + app_config.h + README.md
;    2. copy an [env:<name>] block below and change the filter path
;    3. ./flash.sh picks it up automatically
;
;  Build/flash one:   pio run -e <name> -t upload
;  Or just:           ./flash.sh
; =========================================================================

[platformio]
default_envs = hourglass

; ---- settings every app shares -----------------------------------------
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I include
    -I src/common

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_launcher.csv
board_upload.flash_size = 16MB

; ---- apps ---------------------------------------------------------------
[env:hourglass]
build_src_filter = +<common/> +<apps/hourglass/>
build_flags = ${env.build_flags} -I src/apps/hourglass

[env:boardtest]
build_src_filter = +<common/> +<apps/boardtest/>
build_flags = ${env.build_flags} -I src/apps/boardtest

[env:pomodoro]
build_src_filter = +<common/> +<apps/pomodoro/>
build_flags = ${env.build_flags} -I src/apps/pomodoro

[env:launcher]
build_src_filter = +<common/> +<apps/launcher/>
build_flags = ${env.build_flags} -I src/apps/launcher
